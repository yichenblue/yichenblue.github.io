<aside class="reading-guide" aria-label="{{ page.reading_guide.navigation_label | default: 'Article navigation' | escape }}">
  <details class="reading-guide__disclosure" open>
    <summary>{{ page.reading_guide.title | default: 'On this page' | escape }}</summary>
    <nav aria-label="{{ page.reading_guide.sections_label | default: 'Article sections' | escape }}">
      <ul>
        <li><a href="#article-start">{{ page.reading_guide.overview_label | default: 'Overview' | escape }}</a></li>
        {% for section in page.reading_guide.sections %}
        <li><a href="#{{ section.id | escape }}">{{ section.title | escape }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </details>
</aside>
